name: Arch Linux packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare version and source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      release: ${{ steps.source.outputs.release }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare source and pinned recipe
        id: source
        env:
          AUTO_RELEASE: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
        run: bash packaging/prepare-ci.sh "$PWD/dist"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archivist-source
          path: |
            dist/*.tar.gz
            dist/PKGBUILD
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          name: release-commit
          path: dist/release.bundle
          if-no-files-found: error

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: lfdevs/archlinuxarm:base-devel
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archivist-source
          path: dist
      - name: Build native Arch Linux environment
        env:
          BASE_IMAGE: ${{ matrix.image }}
        run: |
          docker build --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg BUILDER_UID="$(id -u)" \
            -t archivist-builder -f packaging/Dockerfile.ci packaging
      - name: Build, test, and inspect package
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" \
            --mount "type=bind,src=$PWD/dist,dst=/out" \
            archivist-builder bash /repo/packaging/build-ci.sh "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archivist-${{ matrix.arch }}
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: archivist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        if: github.ref == 'refs/heads/master'
        with:
          name: release-commit
          path: release-commit
      - name: Push tested release commit and tag
        if: github.ref == 'refs/heads/master'
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git fetch release-commit/release.bundle HEAD
          if git rev-parse --verify "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "v$RELEASE_VERSION")" = "$RELEASE_COMMIT"
          else
            git tag "v$RELEASE_VERSION" "$RELEASE_COMMIT"
          fi
          git push --atomic origin "$RELEASE_COMMIT:refs/heads/master" "refs/tags/v$RELEASE_VERSION"
      - name: Upload, verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash packaging/publish-ci.sh "v$RELEASE_VERSION" "$PWD/dist"
